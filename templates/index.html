<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Distress Sound Detection Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="bg-overlay"></div>
    
    <!-- Hamburger Menu -->
    <div class="hamburger-menu">
        <button id="hamburger-btn" class="hamburger-btn">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </div>
    
    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Settings</h2>
            <div class="settings-section">
                <label for="receiver-email">Receiver Email:</label>
                <input type="email" id="receiver-email" placeholder="Enter email address">
                <button id="save-email-btn" class="save-btn">Save Email</button>
                <div id="email-message"></div>
            </div>
        </div>
    </div>
    
    <div class="dashboard-container">
        <h1>Real-Time Distress Sound Detection</h1>
        <button id="live-indicator" class="offline">Offline</button>
        <div id="meter-container">
            <div id="level-bar"></div>
        </div>
        <div id="status-msg">Status: Normal</div>
        <form id="upload-form" enctype="multipart/form-data">
            <input type="file" id="audio-file" name="audio" accept="audio/*">
            <button type="submit">Upload Audio</button>
        </form>
        <div id="upload-result"></div>
    </div>

    <script src="/static/dashboard.js"></script>
</body>
</html>
