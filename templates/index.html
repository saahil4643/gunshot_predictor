<!DOCTYPE html>
<html>
<head>
    <title>Gunshot Detection</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.4;
        }

        .row {
            margin-bottom: 16px;
        }

        button {
            margin-right: 8px;
            padding: 8px 12px;
            cursor: pointer;
        }

        #status {
            font-weight: bold;
        }

        pre {
            background: #f5f5f5;
            border: 1px solid #ddd;
            padding: 12px;
            border-radius: 8px;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>
<body>

<h2>🔫 Gunshot Detection</h2>

<div class="row">
    <input type="file" id="audioFile" accept="audio/*">
    <button onclick="upload()">Detect File</button>
</div>

<div class="row">
    <button id="startLiveBtn" onclick="startLive()">Start Live</button>
    <button id="stopLiveBtn" onclick="stopLive()" disabled>Stop Live</button>
    <span id="status">Live status: Idle</span>
</div>

<pre id="result"></pre>

<script>
const LIVE_CLIP_MS = 3000;

let liveStream = null;
let liveChunks = 0;
let liveRunning = false;

function setStatus(text) {
    document.getElementById("status").innerText = `Live status: ${text}`;
}

async function sendAudioBlob(blob, fileName = "audio.webm") {
    const formData = new FormData();
    formData.append("file", blob, fileName);

    const response = await fetch("/predict", {
        method: "POST",
        body: formData
    });

    const data = await response.json();

    if (!response.ok) {
        const shortError = (data.error || "Request failed").split("\n")[0];
        throw new Error(shortError);
    }

    return data;
}

async function upload() {
    const fileInput = document.getElementById("audioFile");
    const file = fileInput.files[0];

    if (!file) {
        alert("Select a file first");
        return;
    }

    try {
        const data = await sendAudioBlob(file, file.name || "upload.wav");

        document.getElementById("result").innerText =
            JSON.stringify(data, null, 2);

    } catch (err) {
        document.getElementById("result").innerText =
            "Error: " + err;
    }
}

async function startLive() {
    if (liveRunning) {
        return;
    }

    try {
        liveStream = await navigator.mediaDevices.getUserMedia({
            audio: {
                echoCancellation: false,
                noiseSuppression: false,
                autoGainControl: false,
                channelCount: 1
            }
        });
        liveRunning = true;
        liveChunks = 0;
        document.getElementById("startLiveBtn").disabled = true;
        document.getElementById("stopLiveBtn").disabled = false;
        setStatus("Listening");

        while (liveRunning && liveStream) {
            const clipBlob = await recordClip(liveStream, LIVE_CLIP_MS);
            if (!clipBlob || clipBlob.size === 0 || !liveRunning) {
                continue;
            }

            liveChunks += 1;

            try {
                setStatus(`Processing chunk ${liveChunks}`);
                const data = await sendAudioBlob(clipBlob, `live_${Date.now()}.webm`);
                const text = [`[Chunk ${liveChunks}]`, JSON.stringify(data, null, 2), ""].join("\n");

                const resultElement = document.getElementById("result");
                resultElement.innerText = text + resultElement.innerText;

                if (data.gunshot_detected) {
                    setStatus("Gunshot detected");
                } else {
                    setStatus(`Listening (chunk ${liveChunks})`);
                }
            } catch (err) {
                setStatus("Live error");
                document.getElementById("result").innerText = "Error: " + err + "\n" + document.getElementById("result").innerText;
            }
        }
    } catch (err) {
        setStatus("Microphone access denied");
        document.getElementById("result").innerText = "Error: " + err;
        stopLive();
    }
}

function recordClip(stream, durationMs) {
    return new Promise((resolve, reject) => {
        let recorder;
        try {
            recorder = new MediaRecorder(stream);
        } catch (err) {
            reject(err);
            return;
        }

        const parts = [];

        recorder.ondataavailable = (event) => {
            if (event.data && event.data.size > 0) {
                parts.push(event.data);
            }
        };

        recorder.onerror = (event) => {
            reject(event.error || new Error("MediaRecorder error"));
        };

        recorder.onstop = () => {
            resolve(new Blob(parts, { type: recorder.mimeType || "audio/webm" }));
        };

        recorder.start();
        setTimeout(() => {
            if (recorder.state !== "inactive") {
                recorder.stop();
            }
        }, durationMs);
    });
}

function stopLive() {
    liveRunning = false;

    if (liveStream) {
        liveStream.getTracks().forEach((track) => track.stop());
    }

    liveStream = null;
    setStatus("Stopped");
    document.getElementById("startLiveBtn").disabled = false;
    document.getElementById("stopLiveBtn").disabled = true;
}
</script>

</body>
</html>
